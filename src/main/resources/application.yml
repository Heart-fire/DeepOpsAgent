server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

# Spring AI Alibaba DashScope 配置
spring:
  profiles:
    active: local  # 默认激活本地配置(application-local.yml 放密钥)；生产用环境变量 SPRING_PROFILES_ACTIVE 覆盖
  ai:
    dashscope:
      # API Key 默认从环境变量读取；本地开发由 application-local.yml 覆盖。切勿硬编码进版本库
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒

    # ===== MCP 客户端配置（已停用）=====
    # 原项目通过 MCP 连接腾讯云 CLS（tencent-cls SSE localhost:3000）查日志。
    # 本项目日志改用自建 Loki + LokiLogsTools（@Tool 直连 Loki HTTP API），不再走 MCP。
    # 如后续要恢复 MCP 接入（例如自建 Loki MCP Server），取消下面注释即可。
    # mcp:
    #   client:
    #     enabled: true
    #     name: tencent-mcp-server
    #     version: 1.0.0
    #     request-timeout: 60s
    #     type: ASYNC
    #     sse:
    #       connections:
    #         tencent-cls:
    #           url: http://localhost:3000
    #           sse-endpoint: /sse

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:}  # 与 spring.ai.dashscope.api-key 共用同一个 key
  embedding:
    model: text-embedding-v4  # 阿里云文本向量化模型

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "qwen3-max"  # 大语言模型名称

# Prometheus 配置
prometheus:
  base-url: http://192.168.182.43:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: false  # 是否启用 Mock 模式（用于测试）

# CLS 云日志服务配置（已停用，保留开关用于向后兼容老 QueryLogsTools）
# cls.mock-enabled=true 时才会注册老的 CLS Mock 日志工具；默认 false，日志查询走 LokiLogsTools
cls:
  mock-enabled: false

# Loki 日志服务配置（本项目日志数据源）
# mock-enabled=false：LokiLogsTools 直连 Loki HTTP API，LokiPushRunner 启动时灌入演示日志
# mock-enabled=true ：不连 Loki，返回本地 Mock 日志（离线开发/演示兜底）
loki:
  base-url: http://192.168.182.43:3100
  timeout: 10  # 超时时间（秒）
  mock-enabled: false

# AI Ops 多 Agent 模型路由配置
# 规划/复杂推理用强模型（qwen-max），单步执行/工具调用用小模型（qwen-turbo）控制成本
aiops:
  planner-model: qwen-max      # Planner + Supervisor 用，低温保证严谨
  executor-model: qwen-turbo   # Executor 用，省钱省延迟
  chat-model: qwen-max         # 普通对话用，作为 Prometheus token 指标的 model tag

# Actuator / Micrometer 监控端点暴露
# 依赖已有 spring-boot-starter-actuator + micrometer-registry-prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
